name: Demo checks
on: [push, pull_request]
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-demo.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: python -m unittest discover -s tests/demo -v
      - run: python -m unittest discover -s tests/data -v
      - run: git diff --exit-code -- build
